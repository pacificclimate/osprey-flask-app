
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "osprey-flask-app"
version = "0.2.0"
description = "A service to expose on-demand routed streamflow."
authors = [{ name = "PCIC" }]
license = { text = "GNU General Public License v3" }
readme = "README.md"
requires-python = ">=3.11, <3.13"
keywords = ["osprey", "flask"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Programming Language :: Python",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]

dependencies = [
    "birdhouse_birdy>=0.8.7,<1.0.0",
    "click>=8.2.1,<9.0.0",
    "dask[dataframe]>=2025.5.1,<2026.0.0",
    "flask>=3.1.1,<4.0.0",
    "gunicorn[gthread]>=23.0.0,<24.0.0",
    "ipyleaflet>=0.19.2,<1.0.0",
    "ipython>=9.2.0,<10.0.0",
    "ipywidgets>=8.1.7,<9.0.0",
    "jupyterlab>=4.4.3,<5.0.0",
    "netcdf4>=1.7.2,<2.0.0",
    "python_dotenv>=1.1.0,<2.0.0",
    "shapely>=2.1.1,<3.0.0",
    "werkzeug>=3.1.3,<4.0.0",
    "wps_tools>=2.1.4,<3.0.0",
    "xarray>=2025.4.0,<2026.0.0",
    "beautifulsoup4 (>=4.13.4,<5.0.0)",


]

[project.optional-dependencies]
dev = [
    "black>=25.1.0,<26.0.0",
    "pyflakes>=3.3.2,<4.0.0",
    "pytest>=8.3.5,<9.0.0",
    "pytest_cov>=6.1.1,<7.0.0",
]
[[tool.poetry.source]]
name = "pcic"
url = "https://pypi.pacificclimate.org/simple/"
priority = "primary"

[tool.pytest.ini_options]
markers = [
    "online: marks tests that use online resources (deselect with '-m \"not online\"')",
]

[tool.poe.tasks]

[tool.poe.tasks.install]
cmd = "poetry install"
help = "Install project dependencies"

[tool.poe.tasks.develop]
cmd = "poetry install --extras dev"
help = "Install dev dependencies (tests, lint, docs)"

[tool.poe.tasks.run]
cmd = "poetry run flask run --host=0.0.0.0 --port=5000"
env = { FLASK_APP = "wsgi.py", FLASK_ENV = "development" }
help = "Run the Flask app with environment set"

[tool.poe.tasks.test]
cmd = "pytest -v -m 'not slow and not online' tests/"
help = "Run fast/offline tests"

[tool.poe.tasks.test-all]
cmd = "pytest -v tests/"
help = "Run all tests including slow and online"

[tool.poe.tasks.lint]
cmd = "black . --check"
help = "Check code formatting with Black"
